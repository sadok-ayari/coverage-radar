[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-radar"
version = "1.0.0"
description = "Collect coverage, cluster it into stories, score salience, write a brief. No dependencies, no model in the loop."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sadok Ayari"}]
keywords = ["media monitoring", "coverage", "news", "clustering", "briefing", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/sadok-ayari/coverage-radar"

[project.scripts]
coverage-radar = "covradar.cli:main"

[tool.setuptools]
packages = ["covradar"]
